<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description"
    content="teleCam – instantly capture and send photos straight to Telegram, with zero storage." />
  <meta name="theme-color" content="#0d0f14" />
  <title>teleCam – Camera to Telegram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="app">

    <!-- Header -->
    <header id="app-header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M23 7L16 12L23 17V7Z" fill="currentColor" />
          <rect x="1" y="5" width="15" height="14" rx="2" fill="currentColor" />
        </svg>
        <span>tele<strong>Cam</strong></span>
      </div>
      <div class="header-right">
        <div id="queue-badge" class="queue-badge" hidden aria-live="polite" aria-label="Pending uploads">
          <span class="queue-spinner"></span>
          <span id="queue-count">0</span>
        </div>
        <div class="mode-toggle" role="group" aria-label="Camera mode">
          <button id="btn-mode-preview" class="mode-btn" aria-pressed="false">
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd"
                d="M4 5a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2V7a2 2 0 00-2-2h-1.586a1 1 0 01-.707-.293l-1.121-1.121A2 2 0 0011.172 3H8.828a2 2 0 00-1.414.586L6.293 4.707A1 1 0 015.586 5H4zm6 9a3 3 0 100-6 3 3 0 000 6z"
                clip-rule="evenodd" />
            </svg>
            Preview
          </button>
          <button id="btn-mode-stealth" class="mode-btn active" aria-pressed="true">
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
              <path fill-rule="evenodd"
                d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z"
                clip-rule="evenodd" />
            </svg>
            Stealth
          </button>
        </div>
      </div>
    </header>

    <!-- Toast container -->
    <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="false"></div>

    <!-- IDLE screen -->
    <section id="screen-idle" class="screen active" aria-label="Start camera">
      <div class="idle-content">
        <div class="idle-icon-ring">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M23 7L16 12L23 17V7Z" fill="currentColor" />
            <rect x="1" y="5" width="15" height="14" rx="2" fill="currentColor" />
          </svg>
        </div>
        <h1>Quick Capture</h1>
        <p>Tap once — photo queues instantly to Telegram. Shoot as fast as you like.</p>
        <button id="btn-start-camera" class="btn-primary" aria-label="Start camera">
          <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd"
              d="M4 5a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2V7a2 2 0 00-2-2h-1.586a1 1 0 01-.707-.293l-1.121-1.121A2 2 0 0011.172 3H8.828a2 2 0 00-1.414.586L6.293 4.707A1 1 0 015.586 5H4zm6 9a3 3 0 100-6 3 3 0 000 6z"
              clip-rule="evenodd" />
          </svg>
          Start Camera
        </button>
        <p class="hint">Requires HTTPS or localhost for camera access</p>
      </div>
    </section>

    <!-- CAMERA screen (unified — video always renders to prevent black frames) -->
    <section id="screen-camera" class="screen" aria-label="Camera" hidden>

      <div class="viewfinder-wrap">
        <!-- Single video, always rendering -->
        <video id="video" autoplay playsinline muted aria-label="Camera feed"></video>
        <canvas id="canvas" hidden aria-hidden="true"></canvas>
        <div id="flash-overlay" class="flash-overlay" aria-hidden="true"></div>
        <div id="focus-ring" class="focus-ring" aria-hidden="true"></div>

        <!-- STEALTH overlay: solid opaque — hides the feed visually
             but video is still in the rendering pipeline (no black frames) -->
        <div id="stealth-overlay" class="stealth-overlay" hidden aria-label="Stealth capture">

          <!-- big capture button -->
          <button id="btn-stealth-capture" class="btn-stealth" aria-label="Capture and send">
            <span class="stealth-icon-wrap">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5" />
                <circle cx="12" cy="12" r="4" fill="currentColor" />
              </svg>
            </span>
          </button>
          <p class="stealth-label" id="stealth-label">Tap to capture &amp; send</p>

          <!-- switch + stop — once, inside the overlay, at the bottom -->
          <div class="stealth-actions">
            <button id="btn-switch-stealth" class="btn-icon btn-icon--ghost" aria-label="Switch camera"
              title="Switch camera">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path
                  d="M20 7h-3a2 2 0 0 0-1.6.8L14 9H10L8.6 7.8A2 2 0 0 0 7 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2Z" />
                <path d="M9 13a3 3 0 1 0 6 0 3 3 0 0 0-6 0" />
                <path d="m15 5-2-2-2 2" />
              </svg>
            </button>
            <button id="btn-stop-stealth" class="btn-icon btn-icon--ghost" aria-label="Stop camera">
              <svg viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd"
                  d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                  clip-rule="evenodd" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- PREVIEW controls bar (shown only in preview mode) -->
      <div id="preview-controls" class="controls-bar" hidden>
        <div class="status-chip" aria-live="polite">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">Ready</span>
        </div>
        <button id="btn-shutter" class="btn-shutter" aria-label="Capture and send">
          <span class="shutter-ring"></span>
          <span class="shutter-core"></span>
        </button>
        <div class="cam-actions">
          <button id="btn-switch-preview" class="btn-icon" aria-label="Switch camera" title="Switch camera">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path
                d="M20 7h-3a2 2 0 0 0-1.6.8L14 9H10L8.6 7.8A2 2 0 0 0 7 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2Z" />
              <path d="M9 13a3 3 0 1 0 6 0 3 3 0 0 0-6 0" />
              <path d="m15 5-2-2-2 2" />
            </svg>
          </button>
          <button id="btn-stop-preview" class="btn-icon" aria-label="Stop camera">
            <svg viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd"
                d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                clip-rule="evenodd" />
            </svg>
          </button>
        </div>
      </div>

    </section>

  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>

</html>
